<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tích hợp X.E</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="cpn.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,300..400,0..1,0&amp;display=block">
<style>body{margin:0}</style>
</helmet>
<div class="{{theme}} shell">
  <dc-import name="AppNav" active="Tích hợp" dark="{{dark}}" hint-size="216px,100%"></dc-import>
  <main class="pad page">
    <dc-import name="AppHero" dark="{{dark}}" hint-size="100%,44px"></dc-import>
    <h1 class="page-title">Tích hợp</h1>
    <div class="seg" role="tablist" aria-label="Nhóm tích hợp" style="align-self: flex-start">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6"><button role="tab" class="{{t.cls}}" aria-selected="{{t.on}}" onClick="{{t.pick}}"><span class="ms" aria-hidden="true">{{t.icon}}</span>{{t.label}}</button></sc-for>
    </div>
    <sc-if value="{{hasSub}}" hint-placeholder-val="{{false}}">
      <div class="sub-tabs" role="tablist" aria-label="Mục con">
        <sc-for list="{{subs}}" as="t" hint-placeholder-count="4"><button role="tab" class="{{t.cls}}" aria-selected="{{t.on}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for>
      </div>
    </sc-if>
    <sc-for list="{{sections}}" as="s" hint-placeholder-count="2">
      <section class="card stack">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px">
          <h2 class="group-title sec-title"><span class="sec-ic" aria-hidden="true"><span class="ms">{{s.icon}}</span></span>{{s.title}}</h2>
          <sc-if value="{{s.hasTag}}" hint-placeholder-val="{{false}}"><span class="{{s.tagCls}}">{{s.tag}}</span></sc-if>
        </div>
        <sc-if value="{{s.hasDesc}}" hint-placeholder-val="{{false}}"><div class="lab muted" style="max-width: 860px; margin-top: -8px">{{s.desc}}</div></sc-if>
        <div class="cfg-grid">
          <sc-for list="{{s.fields}}" as="f" hint-placeholder-count="4">
            <sc-if value="{{f.isInput}}" hint-placeholder-val="{{true}}"><label class="field cfg-field"><span class="l">{{f.label}}</span><span class="box input-box"><input placeholder="{{f.ph}}"></span></label></sc-if>
            <sc-if value="{{f.isSelect}}" hint-placeholder-val="{{false}}"><div class="field cfg-field"><span class="l">{{f.label}}</span><button class="box" aria-label="{{f.label}}">{{f.ph}}<span class="ms" aria-hidden="true">expand_more</span></button></div></sc-if>
            <sc-if value="{{f.isSecret}}" hint-placeholder-val="{{false}}"><label class="field cfg-field"><span class="l">{{f.label}} <span class="tag ok" style="height: 20px">Đã lưu</span></span><span class="box input-box"><span class="ms muted" aria-hidden="true">key</span><input type="password" placeholder="Nhập giá trị mới để thay"></span></label></sc-if>
            <sc-if value="{{f.isText}}" hint-placeholder-val="{{false}}"><label class="field cfg-field cfg-wide"><span class="l">{{f.label}}</span><textarea class="area" rows="3" placeholder="{{f.ph}}"></textarea></label></sc-if>
            <sc-if value="{{f.isUrl}}" hint-placeholder-val="{{false}}"><div class="field cfg-field cfg-wide"><span class="l">{{f.label}}</span><div class="box input-box" style="background: var(--low); border-color: transparent"><span class="muted" style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{f.ph}}</span><button class="text-act">Copy</button></div></div></sc-if>
            <sc-if value="{{f.isToggle}}" hint-placeholder-val="{{false}}"><label class="toggle cfg-wide"><input class="switch" type="checkbox" checked="{{f.on}}" onChange="{{f.toggle}}"><span>{{f.label}}</span></label></sc-if>
            <sc-if value="{{f.isCheck}}" hint-placeholder-val="{{false}}"><label class="choice"><input class="check" type="checkbox" checked="{{f.on}}" onChange="{{f.toggle}}">{{f.label}}</label></sc-if>
            <sc-if value="{{f.isChoice}}" hint-placeholder-val="{{false}}"><div class="field cfg-field cfg-wide"><span class="l">{{f.label}}</span><div class="seg" role="radiogroup" aria-label="{{f.label}}" style="background: var(--low); align-self: flex-start"><sc-for list="{{f.opts}}" as="o" hint-placeholder-count="2"><button role="radio" aria-checked="{{o.on}}" class="{{o.cls}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div></div></sc-if>
            <sc-if value="{{f.isNote}}" hint-placeholder-val="{{false}}"><div class="note cfg-wide">{{f.label}}</div></sc-if>
            <sc-if value="{{f.isHead}}" hint-placeholder-val="{{false}}"><div class="title-small cfg-wide" style="font-weight: 600; margin-top: 4px">{{f.label}}</div></sc-if>
            <sc-if value="{{f.isSentence}}" hint-placeholder-val="{{false}}"><div class="sentence cfg-wide num"><sc-for list="{{f.parts}}" as="p" hint-placeholder-count="3"><sc-if value="{{p.isIn}}" hint-placeholder-val="{{false}}"><input class="{{p.cls}}" aria-label="{{p.aria}}" placeholder="{{p.t}}"></sc-if><sc-if value="{{p.isTx}}" hint-placeholder-val="{{true}}"><span>{{p.t}}</span></sc-if></sc-for></div></sc-if>
            <sc-if value="{{f.isRetry}}" hint-placeholder-val="{{false}}"><div class="cfg-wide stack" style="gap: 8px"><sc-for list="{{retries}}" as="r" hint-placeholder-count="2"><div class="file-row num" style="padding: 8px 12px 8px 16px"><span style="font-weight: 500">{{r.name}}</span><span class="muted">{{r.after}}</span><input class="cell-input short" aria-label="{{r.aria}}" placeholder="60"><span class="muted">phút</span><button class="icon-btn" style="margin-left: auto" aria-label="{{r.delLabel}}" title="Xoá" onClick="{{r.del}}"><span class="ms" aria-hidden="true">delete</span></button></div></sc-for><button class="btn tonal" style="align-self: flex-start; height: 36px" onClick="{{addRetry}}"><span class="ms" aria-hidden="true">add</span>Thêm lần gọi lại</button></div></sc-if>
            <sc-if value="{{f.isBtn}}" hint-placeholder-val="{{false}}"><div style="display: flex; align-items: flex-end"><button class="btn tonal">{{f.label}}</button></div></sc-if>
            <sc-if value="{{f.isTable}}" hint-placeholder-val="{{false}}"><div class="scroller cfg-wide"><table class="tbl" style="--tbl-min: 820px"><thead><tr><sc-for list="{{f.heads}}" as="h" hint-placeholder-count="5"><th>{{h}}</th></sc-for></tr></thead><tbody><sc-for list="{{f.rows}}" as="r" hint-placeholder-count="3"><tr><sc-for list="{{r}}" as="c" hint-placeholder-count="5"><td class="num" style="white-space: nowrap">{{c}}</td></sc-for></tr></sc-for></tbody></table></div></sc-if>
          </sc-for>
        </div>
        <sc-if value="{{s.hasActs}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end"><sc-for list="{{s.acts}}" as="a" hint-placeholder-count="2"><button class="{{a.cls}}" onClick="{{a.run}}">{{a.label}}</button></sc-for></div>
        </sc-if>
      </section>
    </sc-for>
    <sc-if value="{{hasSnack}}" hint-placeholder-val="{{false}}">
      <div class="snack toast" role="status"><span style="flex: 1">{{snack}}</span><button onClick="{{hideSnack}}">Đóng</button></div>
    </sc-if>
  </main>
  <sc-if value="{{confirming}}" hint-placeholder-val="{{false}}">
    <div class="scrim"><div class="sheet confirm" role="alertdialog" aria-modal="true" aria-labelledby="c-title">
      <h2 id="c-title" class="confirm-title">{{ask.title}}</h2>
      <p class="lab muted" style="margin: 0">{{ask.body}}</p>
      <div class="confirm-acts"><button class="btn ghost" onClick="{{cancel}}">Đóng</button><button class="btn" onClick="{{confirm}}">{{ask.ok}}</button></div>
    </div></div>
  </sc-if>
</div>
</x-dc>
